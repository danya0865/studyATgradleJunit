plugins {
    id 'java'
}

group = 'com.practice'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Общие настройки для всех задач запуска тестов (test, smokeTest, regressionTest, negativeTest)
tasks.withType(Test).configureEach {
    testLogging {
        showStandardStreams = true
        events "passed", "failed", "skipped"
        exceptionFormat "full"          // при падении выводит сообщение ассерта: expected / actual
    }
    outputs.upToDateWhen { false }      // тесты выполняются при каждом запуске
    finalizedBy 'testRunOver'           // после любой задачи с тестами пишется Test run is over
}

// Основная задача: запускает все тесты.
// Фильтрация по тегу через параметры командной строки:
//   .\gradlew test -PincludeTag=smoke
//   .\gradlew test -PexcludeTag=negative
test {
    useJUnitPlatform {
        if (project.hasProperty('includeTag')) {
            includeTags project.property('includeTag') as String
        }
        if (project.hasProperty('excludeTag')) {
            excludeTags project.property('excludeTag') as String
        }
    }
}

// Отдельные задачи с фильтрацией по тегу: smokeTest, regressionTest, negativeTest
['smoke', 'regression', 'negative'].each { tagName ->
    tasks.register("${tagName}Test", Test) {
        group = 'verification'
        description = "Запускает только тесты с тегом ${tagName}"
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags tagName
        }
    }
}

// Пишет в консоль после прогона тестов
tasks.register('testRunOver') {
    doLast {
        println 'Test run is over'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}