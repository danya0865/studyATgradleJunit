
plugins {
    id 'base'
    id 'io.qameta.allure' version '2.12.0' apply false
}

allprojects {
    group = 'com.practice'
    version = '1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
